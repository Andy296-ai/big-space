; Действует только под PHP-FPM (Apache/mod_php и `php artisan serve` его не читают).
; Поднимает лимит загрузки вложений вслед за MAX_KILOBYTES в AttachmentController.
; При деплое за nginx дополнительно поднимите client_max_body_size.
upload_max_filesize = 200M
post_max_size = 210M
max_execution_time = 300
